# Builds ready-to-run zips for Windows and macOS.
# Push a tag like v0.1.0 to publish them as a GitHub Release;
# "Run workflow" (manual) builds them as downloadable CI artifacts only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The Seeker character sheets may be used in the game but not shared as
      # files, so they never live in this public repo: the zip is stored as an
      # encrypted secret, unpacked here, and compiled into gg-client (build.rs).
      - name: Character art (embedded in the binary, never shipped as files)
        shell: bash
        env:
          SEEKER_LITE_ZIP_B64: ${{ secrets.SEEKER_LITE_ZIP_B64 }}
        run: |
          if [ -z "$SEEKER_LITE_ZIP_B64" ]; then
            echo "::warning::SEEKER_LITE_ZIP_B64 secret not set: building without character art"
            exit 0
          fi
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'PYEOF'
          import base64, io, os, zipfile
          z = zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ["SEEKER_LITE_ZIP_B64"])))
          os.makedirs("assets/seeker", exist_ok=True)
          n = 0
          for name in z.namelist():
              if "/Spritesheets/" in name and name.endswith(".png"):
                  with open(os.path.join("assets/seeker", os.path.basename(name)), "wb") as f:
                      f.write(z.read(name))
                  n += 1
          print(f"unpacked {n} sheets")
          PYEOF

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p gg-client -p gg-server

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "0xGG-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/gg-client.exe, target/release/gg-server.exe $d
          Copy-Item dist/windows/* $d
          Copy-Item dist/README.txt, assets/CREDITS.md $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          d="0xGG-${{ matrix.name }}"
          mkdir -p "$d"
          cp target/release/gg-client target/release/gg-server dist/macos/*.command dist/README.txt assets/CREDITS.md "$d/"
          chmod +x "$d"/*.command "$d/gg-client" "$d/gg-server"
          zip -qry "$d.zip" "$d"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: 0xGG-${{ matrix.name }}.zip

  # Headless dedicated server for a Linux cloud VM (cross-network bonus).
  # Static musl binary: one ~few-MB file, no runtime deps, nothing to install.
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y musl-tools
      - name: Test server + shared
        run: cargo test --release -p gg-server -p gg-shared
      - name: Build
        run: cargo build --release -p gg-server --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          d=0xGG-server-linux-x64
          mkdir -p "$d"
          cp target/x86_64-unknown-linux-musl/release/gg-server "$d/"
          strip "$d/gg-server"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          path: 0xGG-server-linux-x64.tar.gz

  release:
    needs: [build, linux-server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          body: |
            **Online:** open the game and keep the **CLOUD** tab: it connects to the public server `0xgg.duckdns.org` from any network and shows whether it's up and your ping.

            **LAN:** pick the **LAN** tab. One player presses **HOST GAME** and sends the IP it shows (COPY button); the others type it in the *host's IP* box. `HOST.bat` / `host.command` still run a dedicated server.

            **Linux server:** `0xGG-server-linux-x64.tar.gz` is a single static `gg-server` binary for hosting on a cloud VM.

            **Windows:** `0xGG-windows-x64.zip`, unzip, double-click `PLAY.bat`. Allow the firewall popup on the host (tick Private and Public).

            **macOS (Apple Silicon):** `0xGG-macos-arm64.zip`, double-click `play.command`.
